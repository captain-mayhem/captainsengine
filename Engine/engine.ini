-- configuration file for Hero-Engine --

-- init subsystems --
graphics = false

-- section window --
-- the window's contents in logical pixels (pixels at 96 DPI), scaled to the screen's DPI;
-- fullscreen is borderless on the window's monitor (Alt+Enter toggles it)
width = 1024
height = 768
bitsPerPixel = 32
fullscreen = true
-- the coordinate space of the GUI and the input, scaled to fit the window
virtualWidth = 1024
virtualHeight = 768

-- section input --
-- on a touch screen the first finger is also the left mouse button; false for
-- applications that handle the touch events themselves
touchAsMouse = true

-- section renderer --
renderer = "OpenGL"
maxFramerate = 0 -- frames per second at most, 0 means no limit besides vsync
vsync = true
updateRate = 60 -- calls of the application's update per second

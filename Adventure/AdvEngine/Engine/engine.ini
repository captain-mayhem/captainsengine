--- Advenure engine specific configuration ---

-- debugging options --
debugPorts = true
openConsole = false


--- configuration section for Captains Game Engine (CGE) ---

-- init subsystems --
graphics = true

-- section window --
width = 1024
height = 768
bitsPerPixel = 32
fullscreen = false
-- the coordinate space of the GUI and the input, scaled to fit the window (the Adventure uses the project resolution instead)
virtualWidth = 1024
virtualHeight = 768
windowShown = false

-- section renderer --
renderer = "OpenGL"
maxFramerate = 0 -- frames per second at most, 0 means no limit besides vsync
vsync = true
updateRate = 60 -- calls of the application's update per second

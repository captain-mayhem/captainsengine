-- configuration for Captain's Game Engine (CGE) --

-- init subsystems --
graphics = true
-- the name of the folders for the user's data and settings (UserDirs)
appName = "StoryDesigner"

-- section window --
-- the window's contents in logical pixels (pixels at 96 DPI), scaled to the screen's DPI
width = 1280
height = 800
bitsPerPixel = 32
fullscreen = false
virtualWidth = 1280
virtualHeight = 800

-- section renderer --
renderer = "OpenGL"
maxFramerate = 0 -- frames per second at most, 0 means no limit besides vsync
vsync = true
updateRate = 60 -- calls of the application's update per second

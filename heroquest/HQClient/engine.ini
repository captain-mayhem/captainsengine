-- configuration file for Captain's-Game-Engine -

-- HQClient specific stuff --
-- the server as installed next to the client; without extension (.exe is added on Windows)
HQServerExe = "../HQServer/HQServer"
HQServerDir = "../HQServer"
debugVisibility = false

-- init subsystems --
graphics = true

-- section window --
width = 1024
height = 768
bitsPerPixel = 32
fullscreen = false
-- the coordinate space of the GUI and the input, scaled to fit the window (HQClient sets 1024x768 itself)
virtualWidth = 1024
virtualHeight = 768

-- section renderer --
renderer = "DirectX"
renderer = "GL2"
--renderer = "OpenGL"
maxFramerate = 100 -- frames per second at most, 0 means no limit besides vsync
vsync = true
updateRate = 60 -- calls of the application's update per second

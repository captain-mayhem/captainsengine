-- configuration file for Captain's-Game-Engine --

-- init subsystems --
graphics = false 

-- section window --
width = 1024
height = 768
bitsPerPixel = 32
fullscreen = true

-- section renderer --
renderer = "DirectX"
--renderer = "OpenGL"
maxFramerate = 0 -- frames per second at most, 0 means no limit besides vsync
vsync = true
updateRate = 60 -- calls of the application's update per second

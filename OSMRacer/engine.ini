-- configuration file for Captains-Engine -

-- init subsystems --
graphics = true

-- section window --
width = 1024
height = 768
bitsPerPixel = 32
fullscreen = false
-- the coordinate space of the GUI and the input, scaled to fit the window
virtualWidth = 1024
virtualHeight = 768

-- section renderer --
renderer = "DirectX"
renderer = "OpenGL"
renderer = "GL2"
maxFramerate = 0 -- frames per second at most, 0 means no limit besides vsync
vsync = true
updateRate = 60 -- calls of the application's update per second

-- section physics --
integration_interval = 10 --ms

---------------------------------------------------------

-- terrain settings --
terrain_width = 256 --m
terrain_width_scale = 4 --m
terrain_depth = 256 --m
terrain_depth_scale = 4 --m
terrain_height_scale = 1
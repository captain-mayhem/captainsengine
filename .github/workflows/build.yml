name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # all projects, including the StoryDesigner (C#, built by MSBuild)
          - os: windows-latest
            preset: windows
            build_dir: build/windows
          # all projects
          - os: ubuntu-latest
            preset: default
            build_dir: build/default
          # the engine and the Adventure; the other projects are desktop
          # programs. The Adventure's APKs are built by Gradle below.
          - os: ubuntu-latest
            preset: android
            build_dir: build/android
            options: -DPROJECT_HEROQUEST=OFF -DPROJECT_OSMRACER=OFF
          # the engine and the Adventure as web pages, in both
          # web configurations; the other projects are desktop programs
          - os: ubuntu-latest
            preset: emscripten
            build_dir: build/emscripten
            options: -DPROJECT_HEROQUEST=OFF -DPROJECT_OSMRACER=OFF
          - os: ubuntu-latest
            preset: emscripten-threads
            build_dir: build/emscripten-threads
            options: -DPROJECT_HEROQUEST=OFF -DPROJECT_OSMRACER=OFF
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The Adventure needs a JDK (ANTLR and the StoryDesigner's runtime
      # packages); Gradle runs on it too
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - if: runner.os == 'Linux' && matrix.preset == 'default'
        name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libfontconfig-dev

      - if: startsWith(matrix.preset, 'emscripten')
        name: Set up emsdk
        # sets EMSDK, which the presets' toolchain file path uses
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.22
      - if: startsWith(matrix.preset, 'emscripten')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - if: matrix.preset == 'android'
        name: Install Android build dependencies
        # The NDK is preinstalled on the runner; the preset reads ANDROID_NDK_HOME.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: cmake --preset ${{ matrix.preset }} ${{ matrix.options }}
      - run: cmake --build ${{ matrix.build_dir }} --config Release
      # the unit tests (googletest); they need no display. Not built for Android and the web.
      - if: matrix.preset != 'android' && !startsWith(matrix.preset, 'emscripten')
        run: ctest --test-dir ${{ matrix.build_dir }} -C Release --output-on-failure -j 4
      - if: matrix.preset != 'android'
        run: cmake --install ${{ matrix.build_dir }} --config Release
      # the Adventure's Android project: the player and the demo game as debug
      # APKs (Gradle installs the NDK and CMake versions it names)
      - if: matrix.preset == 'android'
        working-directory: Adventure/android
        # through bash: committed from Windows, gradlew has no executable bit
        run: bash ./gradlew assembleDebug

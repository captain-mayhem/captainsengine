-- configuration file for Captain's-Game-Engine -

-- TDClient specific stuff --
-- the folder of the heroes' saves (%APPDATA%\torchdelve on Windows, ~/.local/share/torchdelve on Linux)
appName = "torchdelve"
-- the server as installed next to the client; without extension (.exe is added on Windows)
TDServerExe = "../TDServer/TDServer"
TDServerDir = "../TDServer"
debugVisibility = false
-- the hero's torch in the 3D view (optional, these are the defaults): its brightness,
-- how fast it falls off with the distance (1/(1+a*d^2), a field is 8 wide), its height over the eyes
-- torchIntensity = 1.5
-- torchAttenuation = 0.0022
-- torchHeight = 1.5

-- init subsystems --
graphics = true

-- section window --
width = 1600
height = 900
bitsPerPixel = 32
fullscreen = false
-- the coordinate space of the GUI and the input, scaled to fit the window (TDClient sets 1920x1080 itself)
virtualWidth = 1920
virtualHeight = 1080

-- section renderer --
renderer = "OpenGL"
maxFramerate = 100 -- frames per second at most, 0 means no limit besides vsync
vsync = true
updateRate = 60 -- calls of the application's update per second

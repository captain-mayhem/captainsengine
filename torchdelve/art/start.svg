<?xml version="1.0" encoding="UTF-8"?>
<!-- Torchdelve's start screen (1920x1080, the client's virtual screen; the scene of the old
     1024x768 screen is centred, at 448,156, where the client puts its dialogs).
     tools/make_start_screen.py renders it into TDClient/textures/other/start.jpg.
     The connect/login/load widgets sit on the panel at the left
     (in the centred scene: labels from x 115, fields up to x 362, y 285 to 510). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- the dungeon wall: rows of stone blocks, every other row offset -->
    <pattern id="stones" width="96" height="64" patternUnits="userSpaceOnUse">
      <rect width="96" height="64" fill="#1b1612"/>
      <rect x="2" y="2" width="44" height="28" rx="3" fill="#2a221b"/>
      <rect x="50" y="2" width="44" height="28" rx="3" fill="#262019"/>
      <rect x="-22" y="34" width="44" height="28" rx="3" fill="#241e18"/>
      <rect x="26" y="34" width="44" height="28" rx="3" fill="#2c241c"/>
      <rect x="74" y="34" width="44" height="28" rx="3" fill="#241e18"/>
      <path d="M6 8h30M56 10h22M32 42h26M80 46h12" stroke="#3a3026" stroke-width="2" stroke-linecap="round"/>
    </pattern>

    <!-- the torches' warm light on the wall -->
    <radialGradient id="glowLeft" cx="548" cy="486" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb04a" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#e0661e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="892" cy="486" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb04a" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="#e0661e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- darkness at the edges -->
    <radialGradient id="vignette" cx="560" cy="420" r="1050" gradientUnits="userSpaceOnUse">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>

    <!-- the stairs fade into the dark towards the top -->
    <linearGradient id="stairShade" x1="0" y1="768" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.97"/>
    </linearGradient>

    <!-- the logo: from white-hot at the top to embers at the bottom -->
    <linearGradient id="fire" x1="0" y1="92" x2="0" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.45" stop-color="#ffbe4d"/>
      <stop offset="0.8" stop-color="#e2621c"/>
      <stop offset="1" stop-color="#9c2a0c"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="flameGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- a torch in its iron bracket; the flame's base is at (0, 0) -->
    <g id="torch">
      <!-- bracket -->
      <rect x="-22" y="58" width="44" height="10" rx="3" fill="#15120f"/>
      <rect x="-5" y="58" width="10" height="44" fill="#15120f"/>
      <rect x="-14" y="98" width="28" height="18" rx="2" fill="#1d1915"/>
      <circle cx="0" cy="107" r="3" fill="#4a4138"/>
      <!-- handle -->
      <path d="M-11 8 L11 8 L6 92 L-6 92 Z" fill="#5a3516"/>
      <path d="M-11 8 L-2 8 L-4 92 L-6 92 Z" fill="#7a4a20"/>
      <rect x="-13" y="2" width="26" height="12" rx="3" fill="#2e2620"/>
      <rect x="-12" y="34" width="24" height="5" fill="#2e2620"/>
      <!-- flame -->
      <ellipse cx="0" cy="-30" rx="34" ry="50" fill="#ff8a2a" opacity="0.65" filter="url(#flameGlow)"/>
      <path d="M0 6 C-26 0 -24 -30 -12 -46 C-8 -36 -4 -36 -4 -44 C-6 -60 2 -76 8 -86 C8 -66 22 -56 22 -34 C26 -40 24 -48 22 -52 C34 -36 30 0 0 6 Z" fill="#d8401a"/>
      <path d="M0 4 C-18 0 -18 -24 -8 -38 C-6 -30 -2 -30 -2 -36 C-2 -50 4 -62 8 -70 C8 -52 18 -44 16 -26 C26 -12 16 4 0 4 Z" fill="#ff9b2e"/>
      <path d="M0 2 C-10 0 -11 -14 -4 -24 C-2 -18 2 -20 2 -26 C4 -34 6 -40 8 -44 C8 -32 14 -24 10 -12 C12 -4 8 2 0 2 Z" fill="#ffd970"/>
      <ellipse cx="0" cy="-8" rx="4.5" ry="9" fill="#fffbe6"/>
    </g>
  </defs>

  <!-- the wall over the whole screen, the rest centred -->
  <rect width="1920" height="1080" fill="url(#stones)"/>
  <g transform="translate(448 156)">
  <rect x="-448" y="-156" width="1920" height="1080" fill="url(#glowLeft)"/>
  <rect x="-448" y="-156" width="1920" height="1080" fill="url(#glowRight)"/>

  <!-- the arch: the way down (down by the frame's margin, so its stairs reach the bottom of the screen) -->
  <g transform="translate(0 156)">
    <!-- voussoirs around the opening -->
    <path d="M594 768 L594 470 A126 126 0 0 1 846 470 L846 768 L818 768 L818 470 A98 98 0 0 0 622 470 L622 768 Z"
          fill="#3b3128" stroke="#120e0b" stroke-width="3"/>
    <g stroke="#120e0b" stroke-width="3">
      <line x1="594" y1="470" x2="622" y2="470"/>
      <line x1="818" y1="470" x2="846" y2="470"/>
      <line x1="605" y1="410" x2="630" y2="424"/>
      <line x1="835" y1="410" x2="810" y2="424"/>
      <line x1="640" y1="365" x2="656" y2="386"/>
      <line x1="800" y1="365" x2="784" y2="386"/>
      <line x1="720" y1="344" x2="720" y2="372"/>
      <line x1="594" y1="560" x2="622" y2="560"/>
      <line x1="818" y1="560" x2="846" y2="560"/>
      <line x1="594" y1="650" x2="622" y2="650"/>
      <line x1="818" y1="650" x2="846" y2="650"/>
    </g>
    <!-- keystone -->
    <path d="M706 340 L734 340 L730 376 L710 376 Z" fill="#4a3d31" stroke="#120e0b" stroke-width="3"/>
    <!-- the opening, with stairs going down -->
    <path d="M622 768 L622 470 A98 98 0 0 1 818 470 L818 768 Z" fill="#050403"/>
    <g fill="#3a2e24">
      <rect x="622" y="728" width="196" height="40"/>
      <rect x="634" y="692" width="172" height="34"/>
      <rect x="646" y="660" width="148" height="30"/>
      <rect x="656" y="632" width="128" height="26"/>
      <rect x="665" y="608" width="110" height="22"/>
      <rect x="673" y="588" width="94" height="18"/>
      <rect x="680" y="571" width="80" height="15"/>
      <rect x="686" y="557" width="68" height="12"/>
    </g>
    <g fill="#6b5641">
      <rect x="622" y="728" width="196" height="6"/>
      <rect x="634" y="692" width="172" height="5"/>
      <rect x="646" y="660" width="148" height="4"/>
      <rect x="656" y="632" width="128" height="4"/>
      <rect x="665" y="608" width="110" height="3"/>
      <rect x="673" y="588" width="94" height="3"/>
      <rect x="680" y="571" width="80" height="2"/>
    </g>
    <path d="M622 768 L622 470 A98 98 0 0 1 818 470 L818 768 Z" fill="url(#stairShade)"/>
  </g>

  <!-- the two torches beside the arch -->
  <use href="#torch" x="548" y="486"/>
  <use href="#torch" x="892" y="486"/>

  <rect x="-448" y="-156" width="1920" height="1080" fill="url(#vignette)"/>

  <!-- the panel for the widgets -->
  <rect x="92" y="262" width="290" height="282" rx="10" fill="#000" opacity="0.6"/>
  <rect x="92" y="262" width="290" height="282" rx="10" fill="none" stroke="#9a6630" stroke-width="2.5"/>
  <rect x="99" y="269" width="276" height="268" rx="7" fill="none" stroke="#5a3a1c" stroke-width="1.2"/>

  <!-- the logo -->
  <text x="512" y="170" text-anchor="middle" font-family="Cinzel Decorative" font-weight="bold"
        font-size="92" letter-spacing="2" fill="#ff7a1f" opacity="0.7" filter="url(#logoGlow)">Torchdelve</text>
  <text x="512" y="170" text-anchor="middle" font-family="Cinzel Decorative" font-weight="bold"
        font-size="92" letter-spacing="2" fill="url(#fire)" stroke="#1a0c04" stroke-width="5"
        stroke-linejoin="round" paint-order="stroke">Torchdelve</text>
  <!-- the subtitle between two thin lines -->
  <g stroke="#9a6630" stroke-width="1.5">
    <line x1="186" y1="212" x2="246" y2="212"/>
    <line x1="778" y1="212" x2="838" y2="212"/>
  </g>
  <text x="512" y="220" text-anchor="middle" font-family="Cinzel Decorative" font-weight="bold"
        font-size="22" letter-spacing="3" fill="#dcb98a" filter="url(#soft)" opacity="0.35">A turn-based dungeon crawler</text>
  <text x="512" y="220" text-anchor="middle" font-family="Cinzel Decorative" font-weight="bold"
        font-size="22" letter-spacing="3" fill="#e6c79a">A turn-based dungeon crawler</text>
  </g>
</svg>
